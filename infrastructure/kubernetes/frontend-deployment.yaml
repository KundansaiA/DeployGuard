apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployguard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployguard-frontend
  template:
    metadata:
      labels:
        app: deployguard-frontend
    spec:
      containers:
        - name: frontend
          image: deployguard-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: deployguard-frontend
spec:
  selector:
    app: deployguard-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
